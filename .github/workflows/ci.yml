name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core:
    name: lint, unit tests, reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check evals tests smallcoder
      - name: unit tests (suite fixture validation runs in the parallel job)
        run: pytest -q -k "not baseline_fails_and_reference_fix_passes"
      - name: benchmark manifest is current
        run: python -m evals.benchmark_manifest --check
      - name: published analyses reproduce byte-identically from tracked rows
        run: python -m evals.check_reproducibility

  suites:
    name: every benchmark task validates (baseline fails, fix passes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -k "baseline_fails_and_reference_fix_passes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smallcoder"
version = "0.1.0"
description = "A coding-agent runtime optimized for small local LLMs (<12B parameters)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
smallcoder = "smallcoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["smallcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixture projects are standalone target repos for the agent, not our codebase.
extend-exclude = ["evals/fixtures", "evals/heldout/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic Option/Argument defaults trip B008 by design.
"smallcoder/cli.py" = ["B008"]
